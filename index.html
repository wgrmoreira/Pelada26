<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pelada 2026</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; 
            overflow: hidden; touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }
        
        canvas { 
            display: block; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        
        /* Telas de Interface (UI) */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a2a6c, #112 90%);
            z-index: 20; color: white; transition: opacity 0.5s;
        }
        .hidden { display: none !important; }
        
        h1.title { 
            font-size: 48px; font-weight: 900; font-style: italic; 
            text-shadow: 4px 4px 0px #e60000, 8px 8px 10px #000; 
            margin-bottom: 5px; letter-spacing: 2px; text-align: center; line-height: 1;
        }
        .mobile-note { font-size: 12px; color: #888; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px;}
        
        button.btn {
            background: linear-gradient(45deg, #00d2ff 0%, #3a7bd5 100%);
            border: 2px solid #fff; border-radius: 30px; padding: 15px 30px;
            font-size: 18px; font-weight: bold; color: white; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-transform: uppercase;
            margin: 10px; min-width: 200px;
        }
        button.btn:active { transform: scale(0.95); }
        button.btn.gold { background: linear-gradient(45deg, #ffd700 0%, #d4af37 100%); color: #000; border-color: #000;}

        .team-selection { 
            display: flex; flex-wrap: wrap; justify-content: center; 
            gap: 20px; margin-top: 30px; max-width: 400px;
        }
        .team-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 40%; }
        .team-label { font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px #000; letter-spacing: 1px; }

        .team-btn {
            width: 90px; height: 90px; border-radius: 50%; border: 4px solid #fff;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s; position: relative;
        }
        .team-btn:active { transform: scale(0.9); }
        
        #btn-fla { background: repeating-linear-gradient(90deg, #cc0000, #cc0000 15px, #111 15px, #111 30px); }
        #btn-vas { background: linear-gradient(135deg, #fff 40%, #111 40%, #111 60%, #fff 60%); border-color: #888; }
        #btn-flu { background: repeating-linear-gradient(90deg, #006400, #006400 15px, #8B0000 15px, #8B0000 30px); }
        #btn-bot { background: #111; }
        #btn-bot::after { content: '★'; color: white; position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-size: 20px; line-height: 1; }

        /* Tabela de Classificação */
        table.standings {
            width: 90%; max-width: 500px; border-collapse: collapse; margin: 20px 0;
            background: rgba(0,0,0,0.6); border-radius: 10px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-align: center;
        }
        .standings th { background: #111; color: #FFD700; padding: 10px; font-size: 14px; }
        .standings td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: bold; }
        .standings tr:last-child td { border-bottom: none; }
        .pos-1 { background: rgba(212, 175, 55, 0.3); }

        #scoreboard {
            position: absolute; top: 15px; right: 20px;
            background: transparent;
            z-index: 10; font-weight: bold; font-size: 24px; color: rgba(255, 255, 255, 0.85);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); pointer-events: none;
        }

        #status { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 18px; color: white; font-weight: bold; z-index: 10; pointer-events: none; text-shadow: 1px 1px 3px #000; }
        #btn-confirm-formation { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 10; }
        
        .trophy { font-size: 80px; margin-bottom: 10px; filter: drop-shadow(0 0 15px #FFD700); }
    </style>
</head>
<body>

    <!-- Telas -->
    <div id="screen-start" class="screen">
        <h1 class="title">PELADA 2026</h1>
        <div class="mobile-note">Desenvolvido para Mobile</div>
        <button class="btn" onclick="goToTeamSelect('QUICK')">JOGO RÁPIDO</button>
        <button class="btn gold" onclick="goToTeamSelect('CAMP')">CAMPEONATO</button>
    </div>

    <div id="screen-team" class="screen hidden">
        <h2 style="margin-bottom: 0;">ESCOLHA SEU TIME</h2>
        <div class="team-selection">
            <div class="team-wrapper"><div id="btn-fla" class="team-btn" onclick="selectTeam('FLA')"></div><div class="team-label">FLAMENGO</div></div>
            <div class="team-wrapper"><div id="btn-vas" class="team-btn" onclick="selectTeam('VAS')"></div><div class="team-label">VASCO</div></div>
            <div class="team-wrapper"><div id="btn-flu" class="team-btn" onclick="selectTeam('FLU')"></div><div class="team-label">FLUMINENSE</div></div>
            <div class="team-wrapper"><div id="btn-bot" class="team-btn" onclick="selectTeam('BOT')"></div><div class="team-label">BOTAFOGO</div></div>
        </div>
    </div>

    <div id="screen-table" class="screen hidden">
        <h2 id="table-title">CLASSIFICAÇÃO</h2>
        <table class="standings" id="standings-table">
            <tr><th>POS</th><th>TIME</th><th>P</th><th>J</th><th>V</th><th>D</th><th>SG</th></tr>
            <!-- Linhas geradas via JS -->
        </table>
        <button id="btn-next-match" class="btn" onclick="startNextMatch()">PRÓXIMA PARTIDA</button>
    </div>

    <div id="screen-champion" class="screen hidden">
        <div class="trophy">🏆</div>
        <h1 class="title" style="font-size: 32px; color: #FFD700;">CAMPEÃO DOS CAMPEÕES</h1>
        <p style="margin-bottom: 20px;">Você dominou a temporada!</p>
        <button class="btn" onclick="location.reload()">JOGAR NOVAMENTE</button>
    </div>

    <div id="screen-gameover" class="screen hidden">
        <h1 id="winner-text" class="title" style="font-size: 36px;">FIM DE JOGO</h1>
        <button class="btn" onclick="location.reload()">VOLTAR AO MENU</button>
    </div>

    <!-- Interface do Jogo -->
    <div id="ui-game" class="hidden">
        <div id="scoreboard"><span id="score-text">0 x 0</span></div>
        <div id="status"></div>
        <button id="btn-confirm-formation" class="btn hidden" onclick="confirmFormation()">PRONTO</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let audioCtx;

// Variáveis de Estado
let STATE = 'MENU'; 
let gameMode = 'QUICK';
let TURN = 1; let nextTurn = 1;
let scoreP1 = 0; let scoreAI = 0;
let playerTeamType = 'FLA'; let aiTeamType = 'VAS';
let scoringTeam = 0; let fieldType = 0; 

let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 10, mass: 0.5, rotation: 0, visible: true };
let players = []; let goalkeepers = []; let particles = []; let fireworksTimer = 0;
let selectedPlayer = null; let dragStart = { x: 0, y: 0 }; let dragCurrent = { x: 0, y: 0 };
let goalWidth, penaltyWidth, penaltyHeight;

// Sistema de Torneio
let currentRound = 0;
let schedule = [];
let standings = [];

// Função para Tela Cheia
function requestFullScreen() {
    let elem = document.documentElement;
    if (elem.requestFullscreen) { elem.requestFullscreen().catch(e=>{}); }
    else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen().catch(e=>{}); }
    else if (elem.msRequestFullscreen) { elem.msRequestFullscreen().catch(e=>{}); }
}

// Sistema de Áudio
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, type, duration, volMod = 1) {
    if(!audioCtx) return;
    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(volMod, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playKick() { playTone(100, 'triangle', 0.2, 1); playTone(150, 'square', 0.1, 0.5); }
function playBounce() { playTone(300, 'sine', 0.1, 0.2); }
function playGKBounce() { playTone(400, 'square', 0.15, 0.8); }
function playWhistle() { playTone(1200, 'sine', 0.4, 0.5); setTimeout(()=>playTone(1400, 'sine', 0.6, 0.6), 200); }
function playFireworkSound() { 
    if(!audioCtx) return;
    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}

// Resolução de Tela - Proporção de Celular no Desktop
function resize() { 
    let w = window.innerWidth; let h = window.innerHeight;
    let maxW = h * 0.6; if (w > maxW) w = maxW;
    canvas.width = w; canvas.height = h;
}
window.addEventListener('resize', resize); resize();

function goToTeamSelect(mode) {
    requestFullScreen(); 
    initAudio(); gameMode = mode;
    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-team').classList.remove('hidden');
}

function selectTeam(team) {
    initAudio(); playerTeamType = team;
    document.getElementById('screen-team').classList.add('hidden');
    
    if (gameMode === 'CAMP') {
        initTournament();
    } else {
        let teamsList = ['FLA', 'VAS', 'FLU', 'BOT'];
        teamsList.splice(teamsList.indexOf(team), 1);
        aiTeamType = teamsList[Math.floor(Math.random() * teamsList.length)];
        document.getElementById('ui-game').classList.remove('hidden');
        setupInitialMatch();
    }
}

// ================= SISTEMA DE CAMPEONATO =================
function initTournament() {
    let teams = ['FLA', 'VAS', 'FLU', 'BOT'];
    standings = teams.map(t => ({ id: t, p: 0, j: 0, v: 0, d: 0, gp: 0, gc: 0, sg: 0 }));
    let outros = teams.filter(t => t !== playerTeamType);
    let t0 = playerTeamType, t1 = outros[0], t2 = outros[1], t3 = outros[2];
    
    schedule = [
        [{h:t0, a:t1}, {h:t2, a:t3}], // R1
        [{h:t0, a:t2}, {h:t3, a:t1}], // R2
        [{h:t0, a:t3}, {h:t1, a:t2}], // R3
        [{h:t1, a:t0}, {h:t3, a:t2}], // R4
        [{h:t2, a:t0}, {h:t1, a:t3}], // R5
        [{h:t3, a:t0}, {h:t2, a:t1}]  // R6
    ];
    currentRound = 0; updateTableScreen();
}

function updateTableScreen() {
    document.getElementById('ui-game').classList.add('hidden');
    document.getElementById('screen-table').classList.remove('hidden');
    document.getElementById('table-title').innerText = currentRound === 0 ? "INÍCIO DA TEMPORADA" : `FIM DA RODADA ${currentRound}`;
    
    standings.sort((a,b) => b.p !== a.p ? b.p - a.p : b.sg !== a.sg ? b.sg - a.sg : b.gp - a.gp);
    
    let tb = document.getElementById('standings-table');
    tb.innerHTML = "<tr><th>POS</th><th>TIME</th><th>P</th><th>J</th><th>V</th><th>D</th><th>SG</th></tr>";
    
    standings.forEach((t, idx) => {
        let row = `<tr class="${idx === 0 ? 'pos-1' : ''}">
            <td>${idx+1}º</td><td>${t.id}</td><td>${t.p}</td><td>${t.j}</td>
            <td>${t.v}</td><td>${t.d}</td><td>${t.sg}</td>
        </tr>`;
        tb.innerHTML += row;
    });

    if (currentRound >= 6) {
        document.getElementById('btn-next-match').innerText = "FINALIZAR TEMPORADA";
        document.getElementById('btn-next-match').onclick = finishTournament;
    } else {
        document.getElementById('btn-next-match').innerText = "PRÓXIMA PARTIDA";
        document.getElementById('btn-next-match').onclick = startNextMatch;
    }
}

function startNextMatch() {
    document.getElementById('screen-table').classList.add('hidden');
    document.getElementById('ui-game').classList.remove('hidden');
    let playerMatch = schedule[currentRound][0];
    aiTeamType = playerMatch.h === playerTeamType ? playerMatch.a : playerMatch.h;
    setupInitialMatch();
}

function processMatchResult() {
    if (gameMode === 'QUICK') {
        STATE = 'GAMEOVER';
        document.getElementById('ui-game').classList.add('hidden');
        document.getElementById('screen-gameover').classList.remove('hidden');
        document.getElementById('winner-text').innerText = scoreP1 >= 3 ? "VOCÊ VENCEU!" : "A IA VENCEU!";
    } else {
        let p1Stats = standings.find(t => t.id === playerTeamType);
        let aiStats = standings.find(t => t.id === aiTeamType);
        
        p1Stats.j++; aiStats.j++;
        p1Stats.gp += scoreP1; p1Stats.gc += scoreAI;
        aiStats.gp += scoreAI; aiStats.gc += scoreP1;
        p1Stats.sg = p1Stats.gp - p1Stats.gc; aiStats.sg = aiStats.gp - aiStats.gc;

        if (scoreP1 > scoreAI) { p1Stats.p += 3; p1Stats.v++; aiStats.d++; } 
        else { aiStats.p += 3; aiStats.v++; p1Stats.d++; }

        let simMatch = schedule[currentRound][1];
        let tH = standings.find(t => t.id === simMatch.h);
        let tA = standings.find(t => t.id === simMatch.a);
        
        let gH = Math.random() > 0.5 ? 3 : Math.floor(Math.random() * 3);
        let gA = gH === 3 ? Math.floor(Math.random() * 3) : 3;

        tH.j++; tA.j++;
        tH.gp += gH; tH.gc += gA; tA.gp += gA; tA.gc += gH;
        tH.sg = tH.gp - tH.gc; tA.sg = tA.gp - tA.gc;
        
        if (gH > gA) { tH.p += 3; tH.v++; tA.d++; }
        else { tA.p += 3; tA.v++; tH.d++; }

        currentRound++; updateTableScreen();
    }
}

function finishTournament() {
    document.getElementById('screen-table').classList.add('hidden');
    if (standings[0].id === playerTeamType) {
        document.getElementById('screen-champion').classList.remove('hidden');
        STATE = 'CHAMPION'; fireworksTimer = 99999;
    } else {
        document.getElementById('screen-gameover').classList.remove('hidden');
        document.getElementById('winner-text').innerText = "FIM DE TEMPORADA. \nVOCÊ FICOU EM " + (standings.findIndex(t=>t.id===playerTeamType)+1) + "º";
    }
}

// ================= LÓGICA GERAL DE FUTEBOL =================
function getGKColor(tName) {
    if(tName === 'FLA') return '#FFD700'; if(tName === 'VAS') return '#888888'; 
    if(tName === 'FLU') return '#0000FF'; if(tName === 'BOT') return '#FFFFFF'; return '#FFD700';
}
function getTeamColors(tName) {
    if(tName === 'FLA') return ['#ff0000', '#000000']; if(tName === 'VAS') return ['#ffffff', '#000000'];
    if(tName === 'FLU') return ['#006400', '#8B0000']; if(tName === 'BOT') return ['#ffffff', '#000000']; return ['#ffffff', '#000000'];
}

function setupInitialMatch() {
    scoreP1 = 0; scoreAI = 0; nextTurn = 1;
    document.getElementById('score-text').innerText = "0 x 0";
    fieldType = Math.floor(Math.random() * 3); 

    const cw = canvas.width; const ch = canvas.height;
    const pr = Math.min(cw, ch) * 0.065; 
    ball.r = pr * 0.45;
    goalWidth = cw * 0.4; penaltyWidth = goalWidth * 1.5; penaltyHeight = ch * 0.12;
    players = []; goalkeepers = [];
    
    let areaAI = { minX: cw/2 - penaltyWidth/2 + pr, maxX: cw/2 + penaltyWidth/2 - pr, minY: pr, maxY: penaltyHeight - pr };
    let areaP1 = { minX: cw/2 - penaltyWidth/2 + pr, maxX: cw/2 + penaltyWidth/2 - pr, minY: ch - penaltyHeight + pr, maxY: ch - pr };

    goalkeepers.push({ x: cw/2, y: penaltyHeight/2, r: pr*0.75, mass: 50, team: 2, isGK: true, num: 1, gkColor: getGKColor(aiTeamType), tx: cw/2, ty: penaltyHeight/2, bounds: areaAI });
    goalkeepers.push({ x: cw/2, y: ch - penaltyHeight/2, r: pr*0.75, mass: 50, team: 1, isGK: true, num: 1, gkColor: getGKColor(playerTeamType), tx: cw/2, ty: ch - penaltyHeight/2, bounds: areaP1 });

    const t1Y = ch * 0.75;
    // Posições base do jogador 
    players.push({ x: cw * 0.5, y: t1Y - pr*2, vx: 0, vy: 0, r: pr, mass: 1, team: 1, num: Math.floor(Math.random()*10)+2, startX: cw * 0.5, startY: t1Y - pr*2 });
    players.push({ x: cw * 0.25, y: t1Y, vx: 0, vy: 0, r: pr, mass: 1, team: 1, num: Math.floor(Math.random()*10)+2, startX: cw * 0.25, startY: t1Y });
    players.push({ x: cw * 0.75, y: t1Y, vx: 0, vy: 0, r: pr, mass: 1, team: 1, num: Math.floor(Math.random()*10)+2, startX: cw * 0.75, startY: t1Y });

    // Criação dos players da IA
    players.push({ x: 0, y: 0, vx: 0, vy: 0, r: pr, mass: 1, team: 2, num: Math.floor(Math.random()*10)+2 });
    players.push({ x: 0, y: 0, vx: 0, vy: 0, r: pr, mass: 1, team: 2, num: Math.floor(Math.random()*10)+2 });
    players.push({ x: 0, y: 0, vx: 0, vy: 0, r: pr, mass: 1, team: 2, num: Math.floor(Math.random()*10)+2 });

    startFormationPhase();
}

function startFormationPhase() {
    STATE = 'FORMATION';
    ball.x = canvas.width / 2; ball.y = canvas.height / 2; ball.vx = 0; ball.vy = 0; ball.visible = true;
    
    let aiIdx = 0;
    for(let p of players) {
        p.vx = 0; p.vy = 0;
        if(p.team === 1 && p.startX) { 
            p.x = p.startX; p.y = p.startY; 
        } else if (p.team === 2) { 
            // Formação Defensiva da IA (Retranca)
            if (aiIdx === 0) {
                p.x = canvas.width / 2; // Centralizado, na frente da área
                p.y = penaltyHeight + p.r * 1.5;
            } else if (aiIdx === 1) {
                p.x = canvas.width / 2 - goalWidth * 0.35; // Bloqueio diagonal esquerda
                p.y = penaltyHeight + p.r * 3.5;
            } else if (aiIdx === 2) {
                p.x = canvas.width / 2 + goalWidth * 0.35; // Bloqueio diagonal direita
                p.y = penaltyHeight + p.r * 3.5;
            }
            aiIdx++;
        }
    }
    document.getElementById('status').innerText = "Organize a formação";
    document.getElementById('btn-confirm-formation').classList.remove('hidden');
}

function confirmFormation() {
    playKick(); document.getElementById('btn-confirm-formation').classList.add('hidden');
    for(let p of players) { if(p.team === 1) { p.startX = p.x; p.startY = p.y; } }
    STATE = 'IDLE'; TURN = nextTurn;
    if (TURN === 1) document.getElementById('status').innerText = "Seu Turno (Arraste na direção desejada)";
    else { document.getElementById('status').innerText = "Turno da IA..."; setTimeout(playAI, 1000); }
}

// Entradas / Slingshot -> Drag-and-Shoot (Ajustado)
function getPointerPos(e) { if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY }; return { x: e.clientX, y: e.clientY }; }
function pointerDown(e) {
    if (STATE !== 'IDLE' && STATE !== 'FORMATION') return;
    if (STATE === 'IDLE' && TURN !== 1) return;
    const pos = getPointerPos(e);
    for (let p of players) {
        if (p.team === 1 && Math.hypot(p.x - pos.x, p.y - pos.y) <= p.r + 15) { 
            selectedPlayer = p; dragStart = pos; dragCurrent = pos; STATE = STATE === 'FORMATION' ? 'DRAGGING' : 'AIMING'; break;
        }
    }
}
function pointerMove(e) {
    if(!selectedPlayer) return;
    e.preventDefault(); let pos = getPointerPos(e);
    if (STATE === 'DRAGGING') { selectedPlayer.x = pos.x; selectedPlayer.y = Math.max(canvas.height/2 + selectedPlayer.r, pos.y); } 
    else if (STATE === 'AIMING') dragCurrent = pos;
}
function pointerUp(e) {
    if (!selectedPlayer) return;
    if (STATE === 'DRAGGING') { STATE = 'FORMATION'; selectedPlayer = null; } 
    else if (STATE === 'AIMING') {
        // AJUSTE DIREÇÃO FRENTE: A direção é baseada de dragCurrent subtraindo dragStart
        let dx = dragCurrent.x - dragStart.x; 
        let dy = dragCurrent.y - dragStart.y;
        
        let dist = Math.hypot(dx, dy); let maxDist = 180;
        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
        if (dist > 10) playKick(); 
        selectedPlayer.vx = dx * 0.16; selectedPlayer.vy = dy * 0.16;
        selectedPlayer = null; STATE = 'MOVING'; document.getElementById('status').innerText = "Movendo...";
    }
}
canvas.addEventListener('mousedown', pointerDown); canvas.addEventListener('mousemove', pointerMove); window.addEventListener('mouseup', pointerUp);
canvas.addEventListener('touchstart', pointerDown, {passive: false}); canvas.addEventListener('touchmove', pointerMove, {passive: false}); window.addEventListener('touchend', pointerUp);

// Física
function resolveCollision(c1, c2) {
    let dx = c2.x - c1.x; let dy = c2.y - c1.y; let dist = Math.hypot(dx, dy);
    if (dist < c1.r + c2.r) {
        if ((c1 === ball && c2.isGK) || (c2 === ball && c1.isGK)) {
            let gk = c1.isGK ? c1 : c2;
            playGKBounce();
            let overlap = (ball.r + gk.r) - dist + 1; let nx = dx / dist; let ny = dy / dist;
            if (c1 === ball) { ball.x -= nx*overlap; ball.y -= ny*overlap; } else { ball.x += nx*overlap; ball.y += ny*overlap; }
            let forceY = gk.team === 1 ? -16 : 16;
            let forceX = (ball.x - gk.x) * 0.3; forceX = Math.max(-12, Math.min(12, forceX));
            ball.vx = forceX; ball.vy = forceY;
            return;
        }

        if (c1 === ball || c2 === ball) playBounce();

        let overlap = (c1.r + c2.r) - dist; let nx = dx / dist; let ny = dy / dist;
        let totalMass = c1.mass + c2.mass; let ratio1 = c2.mass / totalMass; let ratio2 = c1.mass / totalMass;
        c1.x -= nx * overlap * ratio1; c1.y -= ny * overlap * ratio1;
        c2.x += nx * overlap * ratio2; c2.y += ny * overlap * ratio2;
        let kx = (c1.vx || 0) - (c2.vx || 0); let ky = (c1.vy || 0) - (c2.vy || 0);
        let p = 2.0 * (nx * kx + ny * ky) / totalMass; let bounce = 0.85;
        if(!c1.isGK) { c1.vx -= p * c2.mass * nx * bounce; c1.vy -= p * c2.mass * ny * bounce; }
        if(!c2.isGK) { c2.vx += p * c1.mass * nx * bounce; c2.vy += p * c1.mass * ny * bounce; }
    }
}

function updatePhysics() {
    if(STATE === 'MENU' || STATE === 'FORMATION' || STATE === 'DRAGGING' || STATE === 'CHAMPION') return;
    let allEntities = [...players, ...goalkeepers]; if (ball.visible) allEntities.push(ball); 
    let isMoving = false;

    for (let gk of goalkeepers) {
        let dx = gk.tx - gk.x; let dy = gk.ty - gk.y; let dist = Math.hypot(dx, dy);
        if (dist < 5) {
            gk.tx = gk.bounds.minX + Math.random() * (gk.bounds.maxX - gk.bounds.minX);
            gk.ty = gk.bounds.minY + Math.random() * (gk.bounds.maxY - gk.bounds.minY);
        } else { gk.x += (dx / dist) * 2.5; gk.y += (dy / dist) * 2.5; }
    }

    for (let e of allEntities) {
        if (!e.isGK) { e.x += e.vx; e.y += e.vy; e.vx *= 0.97; e.vy *= 0.97; if (Math.abs(e.vx) > 0.1 || Math.abs(e.vy) > 0.1) isMoving = true; else { e.vx = 0; e.vy = 0; } }
        const leftPost = canvas.width / 2 - goalWidth / 2; const rightPost = canvas.width / 2 + goalWidth / 2;
        if (e.x - e.r < 0) { e.x = e.r; e.vx *= -0.8; if(e===ball) playBounce(); }
        if (e.x + e.r > canvas.width) { e.x = canvas.width - e.r; e.vx *= -0.8; if(e===ball) playBounce(); }
        
        if (e.y - e.r < 0) {
            if (e === ball && e.x > leftPost && e.x < rightPost) {
                if (STATE !== 'SCORED') { scoreP1++; scoringTeam = 1; processGoal(); } e.vx = 0; e.vy = 0; e.visible = false; 
            } else { e.y = e.r; e.vy *= -0.8; if(e===ball) playBounce(); }
        }
        if (e.y + e.r > canvas.height) {
            if (e === ball && e.x > leftPost && e.x < rightPost) {
                if (STATE !== 'SCORED') { scoreAI++; scoringTeam = 2; processGoal(); } e.vx = 0; e.vy = 0; e.visible = false;
            } else { e.y = canvas.height - e.r; e.vy *= -0.8; if(e===ball) playBounce(); }
        }
    }
    for (let i = 0; i < allEntities.length; i++) { for (let j = i + 1; j < allEntities.length; j++) resolveCollision(allEntities[i], allEntities[j]); }
    if (STATE === 'MOVING' && !isMoving) { STATE = 'IDLE'; TURN = TURN === 1 ? 2 : 1; document.getElementById('status').innerText = TURN === 1 ? "Seu Turno" : "Turno da IA..."; if (TURN === 2) setTimeout(playAI, 800); }
}

function processGoal() {
    STATE = 'SCORED'; playWhistle(); document.getElementById('score-text').innerText = scoreAI + " x " + scoreP1;
    document.getElementById('status').innerText = "GOOOOOOOL!!!"; fireworksTimer = 180; nextTurn = scoringTeam === 1 ? 2 : 1; 
    setTimeout(() => {
        if (scoreP1 >= 3 || scoreAI >= 3) processMatchResult();
        else startFormationPhase();
    }, 3500);
}

function playAI() {
    if (STATE !== 'IDLE' || TURN !== 2) return;
    let aiPlayers = players.filter(p => p.team === 2);
    let bestPlayer = aiPlayers[0]; let bestScore = -Infinity;
    for(let p of aiPlayers) {
        let d = Math.hypot(p.x - ball.x, p.y - ball.y); let score = -d; 
        if (p.y < ball.y + ball.r) score += 1000; 
        if (score > bestScore) { bestScore = score; bestPlayer = p; }
    }
    let targetX = ball.x; let targetY = ball.y;
    if (bestPlayer.y > ball.y + 5) { targetX = ball.x + (ball.x > canvas.width / 2 ? -ball.r * 1.5 : ball.r * 1.5); targetY = ball.y; 
    } else {
        let angleToGoal = Math.atan2(canvas.height - ball.y, canvas.width / 2 - ball.x);
        targetX = ball.x - Math.cos(angleToGoal) * (ball.r * 0.4); targetY = ball.y - Math.sin(angleToGoal) * (ball.r * 0.4);
    }
    let dx = targetX - bestPlayer.x; let dy = targetY - bestPlayer.y; let dist = Math.hypot(dx, dy); if (dist === 0) { dx = 0; dy = 1; dist = 1; } 
    playKick(); bestPlayer.vx = (dx / dist) * Math.min(27, dist * 0.15 + 14); bestPlayer.vy = (dy / dist) * Math.min(27, dist * 0.15 + 14);
    STATE = 'MOVING'; document.getElementById('status').innerText = "Movendo...";
}

// Renderização Visual
function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
    let rot = Math.PI / 2 * 3; let x, y; let step = Math.PI / spikes; ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
    for(i=0; i<spikes; i++){ x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius; ctx.lineTo(x, y); rot += step; x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius; ctx.lineTo(x, y); rot += step; }
    ctx.lineTo(cx, cy - outerRadius); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

function drawButton(p) {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.clip(); ctx.shadowColor = 'transparent';
    let tName = p.team === 1 ? playerTeamType : aiTeamType;
    
    if (p.isGK) { ctx.fillStyle = p.gkColor; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); } 
    else if (tName === 'FLA') { for (let i = 0; i < 5; i++) { ctx.fillStyle = (i % 2 === 0) ? '#cc0000' : '#111111'; ctx.fillRect(p.x - p.r + (i * (p.r * 2) / 5), p.y - p.r, (p.r * 2) / 5, p.r * 2); } } 
    else if (tName === 'VAS') { ctx.fillStyle = '#f0f0f0'; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); ctx.translate(p.x, p.y); ctx.rotate(Math.PI / 4); ctx.fillStyle = '#111111'; ctx.fillRect(-p.r, -p.r * 0.25, p.r * 2, p.r * 0.5); ctx.rotate(-Math.PI / 4); ctx.translate(-p.x, -p.y); } 
    else if (tName === 'FLU') { for (let i = 0; i < 5; i++) { ctx.fillStyle = (i % 2 === 0) ? '#006400' : '#8B0000'; ctx.fillRect(p.x - p.r + (i * (p.r * 2) / 5), p.y - p.r, (p.r * 2) / 5, p.r * 2); } } 
    else if (tName === 'BOT') { ctx.fillStyle = '#111111'; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); drawStar(p.x, p.y - p.r * 0.45, 5, p.r * 0.2, p.r * 0.08, '#FFFFFF'); }
    
    let grad = ctx.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.1, p.x, p.y, p.r);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.7)'); grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)'); grad.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
    ctx.fillStyle = grad; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); ctx.restore();
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5; ctx.stroke();

    if (p.num) {
        let txtCol = '#FFFFFF'; if (p.isGK) txtCol = '#000'; else if (tName === 'VAS') txtCol = '#FF0000';
        ctx.fillStyle = txtCol; ctx.strokeStyle = '#000000'; ctx.lineWidth = p.isGK ? 1.5 : 3;
        ctx.font = `bold ${p.r * 0.7}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        let numY = (tName === 'BOT' && !p.isGK) ? p.r * 0.2 : 0;
        if(!p.isGK) ctx.strokeText(p.num, p.x, p.y + numY); ctx.fillText(p.num, p.x, p.y + numY);
    }
}

function drawSoccerBall(b) {
    ctx.save(); ctx.translate(b.x, b.y); b.rotation += (Math.abs(b.vx) + Math.abs(b.vy)) * 0.05; ctx.rotate(b.rotation);
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.fillStyle = '#f4f4f4'; ctx.fill(); ctx.shadowColor = 'transparent'; 
    ctx.fillStyle = '#111'; ctx.beginPath();
    for (let i = 0; i < 5; i++) { let a = i * Math.PI*2/5 - Math.PI/2; let dx = Math.cos(a) * b.r * 0.35; let dy = Math.sin(a) * b.r * 0.35; if (i===0) ctx.moveTo(dx,dy); else ctx.lineTo(dx,dy); }
    ctx.closePath(); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#111';
    for(let i = 0; i < 5; i++){
        let a = i * Math.PI*2/5 - Math.PI/2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*b.r*0.35, Math.sin(a)*b.r*0.35); ctx.lineTo(Math.cos(a)*b.r, Math.sin(a)*b.r); ctx.stroke();
        let aMid = a + Math.PI/5; ctx.beginPath(); ctx.moveTo(Math.cos(aMid)*b.r*0.65, Math.sin(aMid)*b.r*0.65); ctx.lineTo(Math.cos(aMid - 0.22)*b.r, Math.sin(aMid - 0.22)*b.r); ctx.arc(0, 0, b.r, aMid - 0.22, aMid + 0.22); ctx.lineTo(Math.cos(aMid)*b.r*0.65, Math.sin(aMid)*b.r*0.65); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.stroke();
    let grad = ctx.createRadialGradient(-b.r*0.3, -b.r*0.3, b.r*0.1, 0, 0, b.r);
    grad.addColorStop(0, 'rgba(255,255,255,0.7)'); grad.addColorStop(1, 'rgba(0,0,0,0.3)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill(); ctx.restore();
}

function drawFireworks() {
    if (fireworksTimer > 0) {
        fireworksTimer--;
        if (fireworksTimer % 20 === 0) {
            playFireworkSound();
            let tName = STATE === 'CHAMPION' ? playerTeamType : (scoringTeam === 1 ? playerTeamType : aiTeamType);
            let colors = getTeamColors(tName);
            let fx = canvas.width * 0.2 + Math.random() * canvas.width * 0.6; let fy = canvas.height * 0.2 + Math.random() * canvas.height * 0.6;
            for(let i=0; i<40; i++) particles.push({ x: fx, y: fy, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, life: 1.0, decay: 0.015 + Math.random()*0.02, color: Math.random() > 0.5 ? colors[0] : colors[1], size: Math.random()*5 + 2 });
        }
    }
    for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
        else {
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            if (p.color === '#000000') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.5; ctx.stroke(); } ctx.globalAlpha = 1.0;
        }
    }
}

function drawField() {
    if (fieldType === 0) {
        const sh = canvas.height / 12;
        for (let i = 0; i < 13; i++) { ctx.fillStyle = i % 2 === 0 ? '#388E3C' : '#4CAF50'; ctx.fillRect(0, i * sh, canvas.width, sh); }
    } else if (fieldType === 1) {
        ctx.fillStyle = '#1b5e20'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Verde escuro
    } else if (fieldType === 2) {
        ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Terra
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeRect(canvas.width/2 - penaltyWidth/2, 0, penaltyWidth, penaltyHeight); ctx.strokeRect(canvas.width/2 - penaltyWidth/2, canvas.height - penaltyHeight, penaltyWidth, penaltyHeight);
    let ml = penaltyWidth * 0.35; ctx.beginPath(); ctx.arc(canvas.width/2, penaltyHeight, ml, 0, Math.PI); ctx.stroke(); ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height - penaltyHeight, ml, Math.PI, Math.PI*2); ctx.stroke();
    const cr = 20; ctx.beginPath(); ctx.arc(0, 0, cr, 0, Math.PI/2); ctx.stroke(); ctx.beginPath(); ctx.arc(canvas.width, 0, cr, Math.PI/2, Math.PI); ctx.stroke(); ctx.beginPath(); ctx.arc(canvas.width, canvas.height, cr, Math.PI, Math.PI*1.5); ctx.stroke(); ctx.beginPath(); ctx.arc(0, canvas.height, cr, Math.PI*1.5, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(canvas.width/2 - goalWidth/2, 0, goalWidth, 12); ctx.fillRect(canvas.width/2 - goalWidth/2, canvas.height - 12, goalWidth, 12);
}

function draw() {
    if (STATE === 'MENU' || document.getElementById('ui-game').classList.contains('hidden')) {
        drawFireworks(); return; 
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawField();

    for (let gk of goalkeepers) drawButton(gk);
    for (let p of players) drawButton(p);
    
    if (STATE !== 'FORMATION' && ball.visible) drawSoccerBall(ball);

    // AJUSTE: Seta de mira agora aponta na direção do arrasto (dx = current - start)
    if (STATE === 'AIMING' && selectedPlayer) {
        let dx = dragCurrent.x - dragStart.x; 
        let dy = dragCurrent.y - dragStart.y;
        
        ctx.beginPath(); ctx.moveTo(selectedPlayer.x, selectedPlayer.y); ctx.lineTo(selectedPlayer.x + dx, selectedPlayer.y + dy);
        let force = Math.min(Math.hypot(dx, dy), 180); ctx.strokeStyle = force > 130 ? '#ff3333' : force > 70 ? '#ffff33' : '#ffffff';
        ctx.lineWidth = 4; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
    } else if (STATE === 'DRAGGING' && selectedPlayer) {
        ctx.beginPath(); ctx.arc(selectedPlayer.x, selectedPlayer.y, selectedPlayer.r + 5, 0, Math.PI*2);
        ctx.strokeStyle = '#00d2ff'; ctx.lineWidth = 3; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
    }

    drawFireworks();
}

function gameLoop() { updatePhysics(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
