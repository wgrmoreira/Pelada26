<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pelada 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* APLICA A FONTE RETRÔ EM TUDO (exceto no que for sobrescrito) */
        * { font-family: 'Press Start 2P', cursive; box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; 
            overflow: hidden; touch-action: none;
            display: flex; justify-content: center; align-items: center;
        }
        
        canvas { display: block; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a2a6c, #112 90%);
            z-index: 20; color: white; transition: opacity 0.5s;
        }
        .hidden { display: none !important; }
        
        #screen-start {
            background: url('assets/img/open.png') center center / cover no-repeat;
            background-color: #111; 
        }
        
        .press-start-btn {
            font-size: 26px; color: #0055ff; background: transparent;
            border: none; cursor: pointer; text-transform: uppercase;
            text-shadow: 
                -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff,
                -3px 0 0 #fff, 3px 0 0 #fff, 0 -3px 0 #fff, 0 3px 0 #fff,
                4px 4px 0px rgba(0,0,0,0.6);
            animation: blink 1.5s infinite; margin-top: 50px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .retro-title {
            font-size: 16px; text-align: center; margin-bottom: 20px; line-height: 1.5;
            color: #0055ff; text-transform: uppercase;
            text-shadow: 
                -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff,
                2px 2px 0px rgba(0,0,0,0.6);
        }

        .retro-menu-container { width: 85%; max-width: 400px; display: flex; flex-direction: column; }
        .retro-menu-header {
            background: linear-gradient(to bottom, #eeeeee, #cccccc);
            color: #cc0000; font-size: 14px; text-align: center; padding: 10px; 
            border: 3px solid #888; border-bottom: none; border-radius: 5px 5px 0 0; text-shadow: 1px 1px 0px #fff;
        }
        .retro-menu-body { background: #0000cc; border: 3px solid #00ff00; display: flex; flex-direction: column; }
        .retro-menu-btn {
            background: transparent; color: #fff; font-size: 12px; border: none; border-bottom: 2px solid #5555ff; 
            padding: 15px; cursor: pointer; transition: 0.1s; text-shadow: 2px 2px 0px #000;
        }
        .retro-menu-btn:hover, .retro-menu-btn:active { color: #ffff00; background: rgba(255,255,255,0.2); }
        .retro-menu-btn:last-child { border-bottom: none; }

        .mobile-note { font-size: 8px; color: #fff; text-shadow: 1px 1px 2px #000; position: absolute; bottom: 20px; letter-spacing: 2px;}

        .team-selection { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; max-width: 400px; }
        .team-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 40%; }
        .team-label { font-size: 10px; color: white; text-shadow: 2px 2px 4px #000; letter-spacing: 1px; }

        .team-btn { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: transform 0.2s; position: relative; }
        .team-btn:active { transform: scale(0.9); }
        
        #btn-fla { background: repeating-linear-gradient(180deg, #cc0000, #cc0000 15px, #111 15px, #111 30px); }
        #btn-vas { background: linear-gradient(135deg, #fff 40%, #111 40%, #111 60%, #fff 60%); border-color: #888; }
        #btn-flu { background: repeating-linear-gradient(90deg, #006400, #006400 15px, #8B0000 15px, #8B0000 30px); }
        #btn-bot { background: #111; }
        #btn-bot::after { content: '★'; color: white; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: 14px; line-height: 1; font-family: Arial; }

        table.standings { width: 90%; max-width: 500px; border-collapse: collapse; margin: 20px 0; background: rgba(0,0,0,0.8); border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-align: center; }
        .standings th { background: #111; color: #FFD700; padding: 10px; font-size: 8px; }
        .standings td { padding: 10px; font-size: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .standings tr:last-child td { border-bottom: none; }
        .pos-1 { background: rgba(212, 175, 55, 0.4); }

        #top-bar {
            position: absolute; top: 15px; width: 90%; left: 5%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.6); padding: 8px 12px; border-radius: 5px;
            font-size: 12px; color: #fff; text-shadow: 2px 2px 4px #000; border: 1px solid rgba(255,255,255,0.2);
        }

        button.btn-game { background: linear-gradient(45deg, #00d2ff 0%, #3a7bd5 100%); border: 2px solid #fff; border-radius: 10px; padding: 15px; font-size: 10px; color: white; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); margin: 8px; }
        #btn-confirm-formation { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 12px;}
        
        .trophy { font-size: 60px; margin-bottom: 10px; filter: drop-shadow(0 0 15px #FFD700); }
    </style>
</head>
<body>

    <div id="screen-start" class="screen">
        <button class="press-start-btn" onclick="openModeMenu()">PRESS START</button>
        <div class="mobile-note">Desenvolvido para Mobile</div>
    </div>

    <div id="screen-mode" class="screen hidden">
        <div class="retro-menu-container">
            <div class="retro-menu-header">MODE SELECT</div>
            <div class="retro-menu-body">
                <button class="retro-menu-btn" onclick="goToTeamSelect('QUICK')">AMISTOSO</button>
                <button class="retro-menu-btn" onclick="goToTeamSelect('CAMP')">CAMPEONATO CARIOCA</button>
            </div>
        </div>
    </div>

    <div id="screen-team" class="screen hidden">
        <h2 class="retro-title">ESCOLHA SEU TIME</h2>
        <div class="team-selection">
            <div class="team-wrapper"><div id="btn-fla" class="team-btn" onclick="selectTeam('FLA')"></div><div class="team-label">FLAMENGO</div></div>
            <div class="team-wrapper"><div id="btn-vas" class="team-btn" onclick="selectTeam('VAS')"></div><div class="team-label">VASCO</div></div>
            <div class="team-wrapper"><div id="btn-flu" class="team-btn" onclick="selectTeam('FLU')"></div><div class="team-label">FLUMINENSE</div></div>
            <div class="team-wrapper"><div id="btn-bot" class="team-btn" onclick="selectTeam('BOT')"></div><div class="team-label">BOTAFOGO</div></div>
        </div>
    </div>

    <div id="screen-table" class="screen hidden">
        <h2 id="table-title" class="retro-title" style="color: #fff; text-shadow: 2px 2px #000;">CLASSIFICAÇÃO</h2>
        <table class="standings" id="standings-table">
            <tr><th>POS</th><th>TIME</th><th>P</th><th>J</th><th>V</th><th>D</th><th>SG</th></tr>
        </table>
        <button id="btn-next-match" class="btn-game" onclick="startNextMatch()">PRÓXIMA PARTIDA</button>
    </div>

    <div id="screen-champion" class="screen hidden">
        <div class="trophy">🏆</div>
        <h1 id="champion-title" class="retro-title" style="font-size: 20px; color: #FFD700; margin-bottom: 20px;">CAMPEÃO</h1>
        <button class="btn-game" onclick="reloadGame()">JOGAR NOVAMENTE</button>
    </div>

    <div id="screen-gameover" class="screen hidden">
        <h1 id="winner-text" class="retro-title" style="font-size: 20px; text-align: center;">FIM DE JOGO</h1>
        <button class="btn-game" onclick="reloadGame()">VOLTAR AO MENU</button>
    </div>

    <div id="ui-game" class="hidden">
        <div id="top-bar">
            <div class="hud-panel" id="clock-text">1T 00:00</div>
            <div class="hud-panel" id="score-text">0 x 0</div>
        </div>
        <button id="btn-confirm-formation" class="btn-game hidden" onclick="confirmFormation()">PRONTO</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let audioCtx;

// Áudios Externos (MPEG)
const audioMenu = new Audio('assets/music/telas.mpeg'); audioMenu.loop = true;
const audioGame = new Audio('assets/music/jogotodo.mpeg'); audioGame.loop = true;
const audioDefesa = new Audio('assets/music/defesa.mpeg');

// Variáveis de Estado
let STATE = 'MENU'; 
let gameMode = 'QUICK';
let TURN = 1; let nextTurn = 1;
let scoreP1 = 0; let scoreAI = 0;
let playerTeamType = 'FLA'; let aiTeamType = 'VAS';
let scoringTeam = 0; let fieldType = 0; 

// Variáveis de Tempo e Lados
let currentHalf = 1; // 1 ou 2
let currentTime = 0; // em minutos
let extraTime = 0; // Acréscimos
let p1Side = 'BOTTOM'; // 'BOTTOM' ou 'TOP'

let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 10, mass: 0.5, rotation: 0, visible: true };
let players = []; let goalkeepers = []; let particles = []; let fireworksTimer = 0;
let selectedPlayer = null; let dragStart = { x: 0, y: 0 }; let dragCurrent = { x: 0, y: 0 };

let boundLeft, boundRight, boundTop, boundBottom, fieldW, fieldH;
let goalWidth, goalDepth, areaW, areaH;

let popup = { text: "", timer: 0, maxTimer: 0, isRetro: false };
let ballTouched = false;
let lastShotY = 0;
let lastTouchTeam = 0; 
let lastPlayerToTouchBall = null; 
let celebrationTarget = null;
let isOwnGoalCelebration = false;

let currentRound = 0; let schedule = []; let standings = [];

function requestFullScreen() {
    let elem = document.documentElement;
    if (elem.requestFullscreen) { elem.requestFullscreen().catch(e=>{}); }
    else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen().catch(e=>{}); }
}

// ================= SISTEMA DE ÁUDIO SINTÉTICO (Para efeitos menores) =================
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type, duration, volMod = 1) {
    if(!audioCtx) return;
    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(volMod, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function playClickSound() {
    initAudio();
    if(!audioCtx) return;
    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

function playCrowdCheer() {
    if(!audioCtx) return;
    let bufferSize = audioCtx.sampleRate * 4; 
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
    let noiseSource = audioCtx.createBufferSource(); noiseSource.buffer = buffer;
    let filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
    filter.frequency.setValueAtTime(600, audioCtx.currentTime); filter.frequency.linearRampToValueAtTime(1500, audioCtx.currentTime + 1.5);
    let gain = audioCtx.createGain(); gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.5); gain.gain.setValueAtTime(0.5, audioCtx.currentTime + 2.5); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 4.0); 
    noiseSource.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noiseSource.start();
}

function playKick() { playTone(100, 'triangle', 0.2, 1); playTone(150, 'square', 0.1, 0.5); }
function playBounce() { playTone(300, 'sine', 0.1, 0.2); }
function playWhistle() { playTone(1200, 'sine', 0.4, 0.5); setTimeout(()=>playTone(1400, 'sine', 0.6, 0.6), 200); }
function playDoubleWhistle() { playWhistle(); setTimeout(playWhistle, 600); }
function playFireworkSound() { 
    if(!audioCtx) return;
    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}

function resize() { 
    let w = window.innerWidth; let h = window.innerHeight;
    let maxW = h * 0.6; if (w > maxW) w = maxW;
    canvas.width = w; canvas.height = h;
}
window.addEventListener('resize', resize); resize();

// ================= NAVEGAÇÃO =================
function openModeMenu() {
    playClickSound(); requestFullScreen(); 
    audioMenu.play().catch(e=>{}); // Inicia música do Menu
    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-mode').classList.remove('hidden');
}

function goToTeamSelect(mode) {
    playClickSound(); gameMode = mode;
    document.getElementById('screen-mode').classList.add('hidden');
    document.getElementById('screen-team').classList.remove('hidden');
}

function selectTeam(team) {
    playClickSound(); playerTeamType = team;
    document.getElementById('screen-team').classList.add('hidden');
    
    audioMenu.pause(); audioMenu.currentTime = 0; // Para música do menu
    audioGame.play().catch(e=>{}); // Toca música do jogo

    if (gameMode === 'CAMP') initTournament();
    else {
        let teamsList = ['FLA', 'VAS', 'FLU', 'BOT']; teamsList.splice(teamsList.indexOf(team), 1);
        aiTeamType = teamsList[Math.floor(Math.random() * teamsList.length)];
        document.getElementById('ui-game').classList.remove('hidden'); setupInitialMatch();
    }
}

function reloadGame() {
    playClickSound();
    audioGame.pause(); audioMenu.play().catch(e=>{});
    setTimeout(() => { location.reload(); }, 200);
}

// ================= BALÃO TEXTO "COMIC" / "PRESS START" =================
function showPopup(text, duration = 120, isRetro = false) {
    popup.text = text; 
    popup.timer = duration; 
    popup.maxTimer = duration;
    popup.isRetro = isRetro;
}

function drawPopup() {
    if (popup.timer > 0) {
        popup.timer--;
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        
        if (popup.isRetro) {
            // Estilo Press Start 2P (Reto, sem zoom maluco)
            ctx.font = "14px 'Press Start 2P', cursive";
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 5; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 3;
            ctx.lineWidth = 4; ctx.strokeStyle = '#000000'; ctx.strokeText(popup.text, 0, 0);
            ctx.shadowColor = 'transparent';
            ctx.fillStyle = '#FFD700'; ctx.fillText(popup.text, 0, 0);
        } else {
            // Estilo Gibi (Inclinado, animado)
            let scale = 1;
            let timeElapsed = popup.maxTimer - popup.timer;
            if (timeElapsed < 10) scale = timeElapsed * 0.1;
            else if (popup.timer < 10) scale = popup.timer * 0.1;
            
            ctx.scale(scale, scale);
            ctx.rotate(-0.05); 
            ctx.font = "italic 900 34px 'Impact', 'Arial Black', sans-serif";
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 5;
            ctx.lineWidth = 8; ctx.strokeStyle = '#000000'; ctx.strokeText(popup.text, 0, 0);
            ctx.shadowColor = 'transparent';
            ctx.fillStyle = '#FFFFFF'; ctx.fillText(popup.text, 0, 0);
        }
        ctx.restore();
    }
}

// ================= RELÓGIO & TEMPO =================
function updateClockUI() {
    let mins = Math.floor(currentTime);
    let secs = (currentTime % 1) === 0.5 ? "30" : "00";
    let displayMins = mins < 10 ? "0" + mins : mins;
    document.getElementById('clock-text').innerText = currentHalf + "T " + displayMins + ":" + secs;
}

function advanceTime() {
    currentTime += 2.5;
    updateClockUI();
}

function checkTimeEnd() {
    if (currentHalf === 1 && currentTime >= 45 + extraTime) {
        endOfHalf();
        return true;
    }
    if (currentHalf === 2 && currentTime >= 90 + extraTime) {
        endOfMatch();
        return true;
    }
    return false;
}

function endOfHalf() {
    STATE = 'HALFTIME';
    playWhistle();
    showPopup("FIM DO 1º TEMPO!", 180, true); 
    
    setTimeout(() => {
        currentHalf = 2;
        currentTime = 45;
        extraTime = Math.floor(Math.random() * 5) + 1; // 1 a 5 minutos
        p1Side = 'TOP'; // TROCA DE LADOS
        updateClockUI();
        
        setupPositionsForHalf();
        startFormationPhase();
    }, 3000);
}

function endOfMatch() {
    STATE = 'GAMEOVER';
    playDoubleWhistle();
    showPopup("FIM DE JOGO!", 180, true);
    setTimeout(() => {
        processMatchResult();
    }, 3000);
}

// ================= CAMPEONATO =================
function initTournament() {
    let teams = ['FLA', 'VAS', 'FLU', 'BOT'];
    standings = teams.map(t => ({ id: t, p: 0, j: 0, v: 0, d: 0, gp: 0, gc: 0, sg: 0 }));
    let outros = teams.filter(t => t !== playerTeamType);
    let t0 = playerTeamType, t1 = outros[0], t2 = outros[1], t3 = outros[2];
    schedule = [[{h:t0, a:t1}, {h:t2, a:t3}], [{h:t0, a:t2}, {h:t3, a:t1}], [{h:t0, a:t3}, {h:t1, a:t2}], [{h:t1, a:t0}, {h:t3, a:t2}], [{h:t2, a:t0}, {h:t1, a:t3}], [{h:t3, a:t0}, {h:t2, a:t1}]];
    currentRound = 0; updateTableScreen();
}

function updateTableScreen() {
    document.getElementById('ui-game').classList.add('hidden');
    document.getElementById('screen-table').classList.remove('hidden');
    document.getElementById('table-title').innerText = currentRound === 0 ? "INÍCIO DA TEMPORADA" : `FIM DA RODADA ${currentRound}`;
    standings.sort((a,b) => b.p !== a.p ? b.p - a.p : b.sg !== a.sg ? b.sg - a.sg : b.gp - a.gp);
    let tb = document.getElementById('standings-table');
    tb.innerHTML = "<tr><th>POS</th><th>TIME</th><th>P</th><th>J</th><th>V</th><th>D</th><th>SG</th></tr>";
    standings.forEach((t, idx) => {
        tb.innerHTML += `<tr class="${idx === 0 ? 'pos-1' : ''}"><td>${idx+1}º</td><td>${t.id}</td><td>${t.p}</td><td>${t.j}</td><td>${t.v}</td><td>${t.d}</td><td>${t.sg}</td></tr>`;
    });
    let btn = document.getElementById('btn-next-match');
    if (currentRound >= 6) { btn.innerText = "FINALIZAR TEMPORADA"; btn.onclick = finishTournament; } 
    else { btn.innerText = "PRÓXIMA PARTIDA"; btn.onclick = startNextMatch; }
}

function startNextMatch() {
    playClickSound();
    document.getElementById('screen-table').classList.add('hidden');
    document.getElementById('ui-game').classList.remove('hidden');
    let playerMatch = schedule[currentRound][0]; aiTeamType = playerMatch.h === playerTeamType ? playerMatch.a : playerMatch.h;
    setupInitialMatch();
}

function processMatchResult() {
    if (gameMode === 'QUICK') {
        let winnerTeam = scoreP1 > scoreAI ? playerTeamType : (scoreAI > scoreP1 ? aiTeamType : 'EMPATE');
        let textResult = winnerTeam === 'EMPATE' ? "EMPATE!" : winnerTeam + " VENCEU!";
        showPopup(textResult, 180, true);
        STATE = 'GAMEOVER'; 
        setTimeout(() => {
            document.getElementById('ui-game').classList.add('hidden'); 
            document.getElementById('screen-gameover').classList.remove('hidden');
            document.getElementById('winner-text').innerText = textResult;
        }, 3000);
    } else {
        let p1Stats = standings.find(t => t.id === playerTeamType); let aiStats = standings.find(t => t.id === aiTeamType);
        p1Stats.j++; aiStats.j++; p1Stats.gp += scoreP1; p1Stats.gc += scoreAI; aiStats.gp += scoreAI; aiStats.gc += scoreP1;
        p1Stats.sg = p1Stats.gp - p1Stats.gc; aiStats.sg = aiStats.gp - aiStats.gc;
        if (scoreP1 > scoreAI) { p1Stats.p += 3; p1Stats.v++; aiStats.d++; } else if (scoreAI > scoreP1) { aiStats.p += 3; aiStats.v++; p1Stats.d++; } else { p1Stats.p += 1; aiStats.p += 1; }
        
        let simMatch = schedule[currentRound][1]; let tH = standings.find(t => t.id === simMatch.h); let tA = standings.find(t => t.id === simMatch.a);
        let gH = Math.random() > 0.5 ? 3 : Math.floor(Math.random() * 3); let gA = gH === 3 ? Math.floor(Math.random() * 3) : 3;
        tH.j++; tA.j++; tH.gp += gH; tH.gc += gA; tA.gp += gA; tA.gc += gH; tH.sg = tH.gp - tH.gc; tA.sg = tA.gp - tA.gc;
        if (gH > gA) { tH.p += 3; tH.v++; tA.d++; } else if (gA > gH) { tA.p += 3; tA.v++; tH.d++; } else { tH.p += 1; tA.p += 1; }
        
        currentRound++; 
        setTimeout(updateTableScreen, 1000);
    }
}

function finishTournament() {
    playClickSound();
    document.getElementById('screen-table').classList.add('hidden');
    if (standings[0].id === playerTeamType) { 
        document.getElementById('screen-champion').classList.remove('hidden'); 
        document.getElementById('champion-title').innerText = playerTeamType + " CAMPEÃO!";
        STATE = 'CHAMPION'; fireworksTimer = 99999; 
    } 
    else { 
        document.getElementById('screen-gameover').classList.remove('hidden'); 
        document.getElementById('winner-text').innerText = standings[0].id + " CAMPEÃO!"; 
    }
}

// ================= JOGO =================
function getGKColor(tName) { if(tName === 'FLA') return '#FFD700'; if(tName === 'VAS') return '#888888'; if(tName === 'FLU') return '#0000FF'; if(tName === 'BOT') return '#FFFFFF'; return '#FFD700'; }
function getTeamColors(tName) { if(tName === 'FLA') return ['#ff0000', '#000000']; if(tName === 'VAS') return ['#ffffff', '#000000']; if(tName === 'FLU') return ['#006400', '#8B0000']; if(tName === 'BOT') return ['#ffffff', '#000000']; return ['#ffffff', '#000000']; }
function getUniqueNumbers(count) {

function setupInitialMatch() {

function getTopArea() { return { minX: canvas.width/2 - goalWidth/2 + ball.r, maxX: canvas.width/2 + goalWidth/2 - ball.r, minY: boundTop + ball.r, maxY: boundTop + fieldH * 0.1 - ball.r }; }

function setupPositionsForHalf() {
    const cw = canvas.width;
    // Configura os Goleiros baseados no lado

    goalkeepers[1].team = 1; // P1
    goalkeepers[1].y = p1Side === 'BOTTOM' ? boundBottom - fieldH*0.05 : boundTop + fieldH*0.05;
    goalkeepers[1].ty = goalkeepers[1].y;
    goalkeepers[1].x = cw/2;

function startFormationPhase() {
    STATE = 'FORMATION';
    ball.x = canvas.width / 2; ball.y = canvas.height / 2; ball.vx = 0; ball.vy = 0; ball.visible = true;
    lastTouchTeam = 0; lastPlayerToTouchBall = null; celebrationTarget = null;
    
    let aiIdx = 0; let p1Idx = 0;
    const cw = canvas.width;
    
    for(let p of players) {
        p.vx = 0; p.vy = 0;
        if(p.team === 1) { 
            if (p1Side === 'BOTTOM') {
                if(p1Idx===0){ p.x = cw*0.5; p.y = boundBottom - fieldH*0.2; }
                else if(p1Idx===1){ p.x = boundLeft + fieldW*0.25; p.y = boundBottom - fieldH*0.4; }
                else if(p1Idx===2){ p.x = boundLeft + fieldW*0.75; p.y = boundBottom - fieldH*0.4; }
                else if(p1Idx===3){ p.x = cw*0.5; p.y = boundBottom - fieldH*0.45; }
            } else {
                if(p1Idx===0){ p.x = cw*0.5; p.y = boundTop + fieldH*0.2; }
                else if(p1Idx===1){ p.x = boundLeft + fieldW*0.25; p.y = boundTop + fieldH*0.4; }
                else if(p1Idx===2){ p.x = boundLeft + fieldW*0.75; p.y = boundTop + fieldH*0.4; }
                else if(p1Idx===3){ p.x = cw*0.5; p.y = boundTop + fieldH*0.45; }
            }
            p.startX = p.x; p.startY = p.y;
            p1Idx++;
        } else if (p.team === 2) { 
            if (p1Side === 'BOTTOM') { // IA defende Topo
                if(aiIdx===0){ p.x = cw/2; p.y = boundTop + areaH + p.r * 1.5; }
                else if(aiIdx===1){ p.x = cw/2 - goalWidth * 0.4; p.y = boundTop + areaH + p.r * 3; }
                else if(aiIdx===2){ p.x = cw/2 + goalWidth * 0.4; p.y = boundTop + areaH + p.r * 3; }
                else if(aiIdx===3){ p.x = cw/2; p.y = boundTop + fieldH * 0.4; }
            } else { // IA defende Fundo
                if(aiIdx===0){ p.x = cw/2; p.y = boundBottom - areaH - p.r * 1.5; }
                else if(aiIdx===1){ p.x = cw/2 - goalWidth * 0.4; p.y = boundBottom - areaH - p.r * 3; }
                else if(aiIdx===2){ p.x = cw/2 + goalWidth * 0.4; p.y = boundBottom - areaH - p.r * 3; }
                else if(aiIdx===3){ p.x = cw/2; p.y = boundBottom - fieldH * 0.4; }
            }
            aiIdx++;
        }
    }
    
    for(let gk of goalkeepers) {
        gk.vx = 0; gk.vy = 0; gk.tx = canvas.width / 2; gk.x = canvas.width / 2;
        gk.y = gk.team === 1 ? (p1Side === 'BOTTOM' ? boundBottom - fieldH*0.05 : boundTop + fieldH*0.05) : (p1Side === 'BOTTOM' ? boundTop + fieldH*0.05 : boundBottom - fieldH*0.05);
        gk.ty = gk.y;
    }

    document.getElementById('btn-confirm-formation').classList.remove('hidden');
}

function confirmFormation() {
    playClickSound(); playKick(); 
    showPopup("COMEÇA O JOGO!", 90, true); 
    document.getElementById('btn-confirm-formation').classList.add('hidden');
    for(let p of players) { if(p.team === 1) { p.startX = p.x; p.startY = p.y; } }
    STATE = 'IDLE'; TURN = nextTurn;

}

function getPointerPos(e) { if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY }; return { x: e.clientX, y: e.clientY }; }
function pointerDown(e) {
    if (STATE !== 'IDLE' && STATE !== 'FORMATION') return;
    if (STATE === 'IDLE' && TURN !== 1) return;
    const pos = getPointerPos(e);
    for (let p of players) {
        if (p.team === 1 && Math.hypot(p.x - pos.x, p.y - pos.y) <= p.r + 15) { 
            selectedPlayer = p; dragStart = pos; dragCurrent = pos; STATE = STATE === 'FORMATION' ? 'DRAGGING' : 'AIMING'; break;
        }
    }
}
function pointerMove(e) {
    if(!selectedPlayer) return;
    e.preventDefault(); let pos = getPointerPos(e);
    if (STATE === 'DRAGGING') { 
        let newX = Math.max(boundLeft + selectedPlayer.r, Math.min(boundRight - selectedPlayer.r, pos.x)); 
        let newY = Math.max(boundTop + selectedPlayer.r, Math.min(boundBottom - selectedPlayer.r, pos.y)); 
        
        // Impede passar do meio campo
        if(p1Side === 'BOTTOM' && newY < canvas.height/2 + selectedPlayer.r) newY = canvas.height/2 + selectedPlayer.r;
        if(p1Side === 'TOP' && newY > canvas.height/2 - selectedPlayer.r) newY = canvas.height/2 - selectedPlayer.r;

        // Impede área
        let inPenaltyX = newX > canvas.width/2 - areaW/2 && newX < canvas.width/2 + areaW/2;
        let inTopArea = newY < boundTop + areaH;
        let inBotArea = newY > boundBottom - areaH;
        
        if (inPenaltyX) {
            if (p1Side === 'BOTTOM' && inBotArea) newY = boundBottom - areaH - selectedPlayer.r;
            if (p1Side === 'TOP' && inTopArea) newY = boundTop + areaH + selectedPlayer.r;
        }

        selectedPlayer.x = newX; selectedPlayer.y = newY;
    } 
    else if (STATE === 'AIMING') dragCurrent = pos;
}
function pointerUp(e) {
    if (!selectedPlayer) return;
    if (STATE === 'DRAGGING') { STATE = 'FORMATION'; selectedPlayer = null; } 
    else if (STATE === 'AIMING') {
        let dx = dragStart.x - dragCurrent.x; let dy = dragStart.y - dragCurrent.y;
        let dist = Math.hypot(dx, dy); let maxDist = 60; 
        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
        let powerMult = 28 / maxDist;
        if (dist > 5) { playKick(); ballTouched = false; lastShotY = ball.y; lastTouchTeam = 1; advanceTime(); } 
        selectedPlayer.vx = dx * powerMult * 0.7; selectedPlayer.vy = dy * powerMult * 0.7;
        selectedPlayer = null; STATE = 'MOVING';
    }
}
canvas.addEventListener('mousedown', pointerDown); canvas.addEventListener('mousemove', pointerMove); window.addEventListener('mouseup', pointerUp);
canvas.addEventListener('touchstart', pointerDown, {passive: false}); canvas.addEventListener('touchmove', pointerMove, {passive: false}); window.addEventListener('touchend', pointerUp);

function resolveCollision(c1, c2) {
    let dx = c2.x - c1.x; let dy = c2.y - c1.y; let dist = Math.hypot(dx, dy);
    if (dist < c1.r + c2.r) {
        
        if (c1 === ball || c2 === ball) {
            ballTouched = true;
            let playerPiece = c1 === ball ? c2 : c1;
            lastTouchTeam = playerPiece.team;
            lastPlayerToTouchBall = playerPiece;
        }

        if ((c1 === ball && c2.isGK) || (c2 === ball && c1.isGK)) {
            let ballSpeed = Math.hypot(ball.vx, ball.vy);
            if (ballSpeed > 5 && STATE !== 'SCORED') showPopup("QUE DEFESA!", 120);

            let gk = c1.isGK ? c1 : c2; 
            audioDefesa.currentTime = 0; audioDefesa.play().catch(e=>{}); // SOM DEFESA

            let overlap = (ball.r + gk.r) - dist + 1; let nx = dx / dist; let ny = dy / dist;
            if (c1 === ball) { ball.x -= nx*overlap; ball.y -= ny*overlap; } else { ball.x += nx*overlap; ball.y += ny*overlap; }
            
            // Força dependendo do lado
            let isGkTop = gk.y < canvas.height/2;
            let forceY = isGkTop ? 10 : -10; 
            let forceX = (ball.x - gk.x) * 0.2; forceX = Math.max(-8, Math.min(8, forceX));
            ball.vx = forceX; ball.vy = forceY; return;
        }

        let overlap = (c1.r + c2.r) - dist; let nx = dx / dist; let ny = dy / dist;
        let totalMass = c1.mass + c2.mass; let ratio1 = c2.mass / totalMass; let ratio2 = c1.mass / totalMass;
        c1.x -= nx * overlap * ratio1; c1.y -= ny * overlap * ratio1;
        c2.x += nx * overlap * ratio2; c2.y += ny * overlap * ratio2;
        let kx = (c1.vx || 0) - (c2.vx || 0); let ky = (c1.vy || 0) - (c2.vy || 0);
        let p = 2.0 * (nx * kx + ny * ky) / totalMass; let bounce = 0.85;
        if(!c1.isGK) { c1.vx -= p * c2.mass * nx * bounce; c1.vy -= p * c2.mass * ny * bounce; }
        if(!c2.isGK) { c2.vx += p * c1.mass * nx * bounce; c2.vy += p * c1.mass * ny * bounce; }
    }
}

function updatePhysics() {
    if(STATE === 'MENU' || STATE === 'FORMATION' || STATE === 'DRAGGING' || STATE === 'CHAMPION' || STATE === 'HALFTIME') return;
    let allEntities = [...players, ...goalkeepers]; if (ball.visible) allEntities.push(ball); 
    let isMoving = false;

    let ballInTopArea = ball.x > canvas.width/2 - areaW/2 && ball.x < canvas.width/2 + areaW/2 && ball.y < boundTop + areaH;
    let ballInBotArea = ball.x > canvas.width/2 - areaW/2 && ball.x < canvas.width/2 + areaW/2 && ball.y > boundBottom - areaH;

    for (let gk of goalkeepers) {
        let speed = 1.05; 
        let isGkTop = gk.y < canvas.height/2;
        
        if (isGkTop && ballInTopArea && ball.visible) { gk.tx = ball.x; gk.ty = ball.y; speed = 2.1; }
        else if (!isGkTop && ballInBotArea && ball.visible) { gk.tx = ball.x; gk.ty = ball.y; speed = 2.1; }
        else {
            let dx = gk.tx - gk.x; let dy = gk.ty - gk.y; let dist = Math.hypot(dx, dy);
            if (dist < 5) {
                gk.tx = gk.bounds.minX + Math.random() * (gk.bounds.maxX - gk.bounds.minX);
                gk.ty = gk.bounds.minY + Math.random() * (gk.bounds.maxY - gk.bounds.minY);
            }
        }
        let dx = gk.tx - gk.x; let dy = gk.ty - gk.y; let dist = Math.hypot(dx, dy);
        if(dist > 0) { gk.x += (dx / dist) * speed; gk.y += (dy / dist) * speed; }
    }

    for (let e of allEntities) {
        if (!e.isGK) { 
            e.x += e.vx; e.y += e.vy; e.vx *= 0.97; e.vy *= 0.97; 
            if (Math.abs(e.vx) > 0.25 || Math.abs(e.vy) > 0.25) isMoving = true; else { e.vx = 0; e.vy = 0; } 
        }
        
        if (e.x - e.r < boundLeft) { e.x = boundLeft + e.r; e.vx *= -0.8; if(e===ball) playBounce(); }
        if (e.x + e.r > boundRight) { e.x = boundRight - e.r; e.vx *= -0.8; if(e===ball) playBounce(); }
        
        if (e === ball) {
            if (e.y - e.r < boundTop) { 
                if (e.x > canvas.width/2 - goalWidth/2 && e.x < canvas.width/2 + goalWidth/2) {
                    if (STATE !== 'SCORED') { 
                        if(p1Side === 'BOTTOM') { scoreP1++; scoringTeam = 1; processGoal(lastTouchTeam === 2); }
                        else { scoreAI++; scoringTeam = 2; processGoal(lastTouchTeam === 1); }
                    } 
                    e.vx = 0; e.vy = 0; e.visible = false; 
                } else { e.y = boundTop + e.r; e.vy *= -0.8; playBounce(); }
            }
            if (e.y + e.r > boundBottom) { 
                if (e.x > canvas.width/2 - goalWidth/2 && e.x < canvas.width/2 + goalWidth/2) {
                    if (STATE !== 'SCORED') { 
                        if(p1Side === 'BOTTOM') { scoreAI++; scoringTeam = 2; processGoal(lastTouchTeam === 1); }
                        else { scoreP1++; scoringTeam = 1; processGoal(lastTouchTeam === 2); }
                    } 
                    e.vx = 0; e.vy = 0; e.visible = false;
                } else { e.y = boundBottom - e.r; e.vy *= -0.8; playBounce(); }
            }
        } else {
            if (e.y - e.r < boundTop) { e.y = boundTop + e.r; e.vy *= -0.8; }
            if (e.y + e.r > boundBottom) { e.y = boundBottom - e.r; e.vy *= -0.8; }
        }
    }
    for (let i = 0; i < allEntities.length; i++) { for (let j = i + 1; j < allEntities.length; j++) resolveCollision(allEntities[i], allEntities[j]); }
    
    if (STATE === 'MOVING' && !isMoving) { 
        STATE = 'IDLE'; 
        if (checkTimeEnd()) return;

        if (!ballTouched && STATE !== 'SCORED' && STATE !== 'GAMEOVER') {
            let missTexts = ["QUE DESELEGANTE!", "QUE TRISTEZA!", "JOGADA HORRÍVEL!"];
            showPopup(missTexts[Math.floor(Math.random() * missTexts.length)], 120);
        }
        TURN = TURN === 1 ? 2 : 1; 
        if (TURN === 2) setTimeout(playAI, 400); 
    }
}

function processGoal(isOwnGoal) {
    STATE = 'SCORED'; playWhistle(); playCrowdCheer();
    document.getElementById('score-text').innerText = scoreAI + " x " + scoreP1;
    
    let waitTime = 4500; 
    
    if (isOwnGoal) {
        showPopup("GOL CONTRA!", 300);
    } else {
        let isGolaco = false;
        if (p1Side === 'BOTTOM') {
            if (scoringTeam === 1 && lastShotY > canvas.height / 2) isGolaco = true;
            if (scoringTeam === 2 && lastShotY < canvas.height / 2) isGolaco = true;
        } else {
            if (scoringTeam === 1 && lastShotY < canvas.height / 2) isGolaco = true;
            if (scoringTeam === 2 && lastShotY > canvas.height / 2) isGolaco = true;
        }
        
        if (isGolaco) showPopup("GOLAAAAÇOOOO!", 300);
        else showPopup("GOLLLLLLLLLLLLL!", 300);
    }

    fireworksTimer = 300; nextTurn = scoringTeam === 1 ? 2 : 1; 
    
    celebrationTarget = lastPlayerToTouchBall;
    isOwnGoalCelebration = isOwnGoal;

    setTimeout(() => {
        celebrationTarget = null;
        if (checkTimeEnd()) return;
        startFormationPhase();
    }, waitTime); 
}

function playAI() {
    if (STATE !== 'IDLE' || TURN !== 2) return;
    let aiPlayers = players.filter(p => p.team === 2);
    let bestPlayer = aiPlayers[0]; let bestScore = -Infinity;
    for(let p of aiPlayers) {
        let d = Math.hypot(p.x - ball.x, p.y - ball.y); let score = -d; 
        
        if (p1Side === 'BOTTOM') { // AI Ataca pra baixo (y cresce)
            if (p.y < ball.y + ball.r) score += 1000; 
        } else { // AI Ataca pra cima (y diminui)
            if (p.y > ball.y - ball.r) score += 1000; 
        }

        if (score > bestScore) { bestScore = score; bestPlayer = p; }
    }
    
    let targetX = ball.x; let targetY = ball.y;
    let isDanger = false;
    
    if (p1Side === 'BOTTOM') { // AI defende topo
        isDanger = (ball.y < boundTop + fieldH * 0.3) && (bestPlayer.y > ball.y - 2);
        if (isDanger) { targetX = ball.x + (ball.x > canvas.width/2 ? -ball.r*1.5 : ball.r*1.5); targetY = ball.y - ball.r*0.5; } 
        else if (bestPlayer.y > ball.y + 5) { targetX = ball.x + (ball.x > canvas.width/2 ? -ball.r*1.5 : ball.r*1.5); targetY = ball.y; } 
        else { let ang = Math.atan2(boundBottom - ball.y, canvas.width/2 - ball.x); targetX = ball.x - Math.cos(ang)*(ball.r*0.4); targetY = ball.y - Math.sin(ang)*(ball.r*0.4); }
    } else { // AI defende baixo
        isDanger = (ball.y > boundBottom - fieldH * 0.3) && (bestPlayer.y < ball.y + 2);
        if (isDanger) { targetX = ball.x + (ball.x > canvas.width/2 ? -ball.r*1.5 : ball.r*1.5); targetY = ball.y + ball.r*0.5; } 
        else if (bestPlayer.y < ball.y - 5) { targetX = ball.x + (ball.x > canvas.width/2 ? -ball.r*1.5 : ball.r*1.5); targetY = ball.y; } 
        else { let ang = Math.atan2(boundTop - ball.y, canvas.width/2 - ball.x); targetX = ball.x - Math.cos(ang)*(ball.r*0.4); targetY = ball.y - Math.sin(ang)*(ball.r*0.4); }
    }
    
    let dx = targetX - bestPlayer.x; let dy = targetY - bestPlayer.y; let dist = Math.hypot(dx, dy); if (dist === 0) { dx = 0; dy = 1; dist = 1; } 
    
    playKick(); ballTouched = false; lastShotY = ball.y; lastTouchTeam = 2; advanceTime();
    bestPlayer.vx = (dx / dist) * Math.min(27, dist * 0.15 + 14); bestPlayer.vy = (dy / dist) * Math.min(27, dist * 0.15 + 14);
    STATE = 'MOVING';
}

function updateCelebrations() {
    if (STATE === 'SCORED') {
        let scoringTeamId = scoringTeam;
        let concedingTeamId = scoringTeamId === 1 ? 2 : 1;

        for (let p of players) { // Goleiros foram excluidos do loop de comemoração
            if (isOwnGoalCelebration) {
                if (p.team === concedingTeamId) { p.x += (Math.random() - 0.5) * 3; p.y += (Math.random() - 0.5) * 3; } 
                else if (p.team === scoringTeamId) {
                    let target = players.find(pl => pl.team === scoringTeamId);
                    if (p === target) { p.x += (Math.random() - 0.5) * 5; p.y += (Math.random() - 0.5) * 5; } 
                    else {
                        let dx = target.x - p.x; let dy = target.y - p.y; let dist = Math.hypot(dx, dy);
                        if (dist > target.r * 2.5) { p.x += (dx / dist) * 3; p.y += (dy / dist) * 3; } 
                        else { p.x += (Math.random() - 0.5) * 5; p.y += (Math.random() - 0.5) * 5; }
                    }
                }
            } else {
                if (p.team === scoringTeamId && celebrationTarget) {
                    if (p === celebrationTarget) { p.x += (Math.random() - 0.5) * 5; p.y += (Math.random() - 0.5) * 5; } 
                    else {
                        let dx = celebrationTarget.x - p.x; let dy = celebrationTarget.y - p.y; let dist = Math.hypot(dx, dy);
                        if (dist > celebrationTarget.r * 2.5) { p.x += (dx / dist) * 3; p.y += (dy / dist) * 3; } 
                        else { p.x += (Math.random() - 0.5) * 5; p.y += (Math.random() - 0.5) * 5; }
                    }
                }
            }
        }
    }
}

// Renderização Visual
function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
    let rot = Math.PI / 2 * 3; let x, y; let step = Math.PI / spikes; ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
    for(let i=0; i<spikes; i++){ x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius; ctx.lineTo(x, y); rot += step; x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius; ctx.lineTo(x, y); rot += step; }
    ctx.lineTo(cx, cy - outerRadius); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

function drawButton(p) {
    ctx.save(); 
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.clip(); ctx.shadowColor = 'transparent';
    let tName = p.team === 1 ? playerTeamType : aiTeamType;
    
    if (p.isGK) { ctx.fillStyle = p.gkColor; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); } 
    else if (tName === 'FLA') { 
        for (let i = 0; i < 5; i++) { ctx.fillStyle = (i % 2 === 0) ? '#cc0000' : '#111111'; ctx.fillRect(p.x - p.r, p.y - p.r + (i * (p.r * 2) / 5), p.r * 2, (p.r * 2) / 5); } 
    } 
    else if (tName === 'VAS') { ctx.fillStyle = '#f0f0f0'; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); ctx.translate(p.x, p.y); ctx.rotate(Math.PI / 4); ctx.fillStyle = '#111111'; ctx.fillRect(-p.r, -p.r * 0.25, p.r * 2, p.r * 0.5); ctx.rotate(-Math.PI / 4); ctx.translate(-p.x, -p.y); } 
    else if (tName === 'FLU') { for (let i = 0; i < 5; i++) { ctx.fillStyle = (i % 2 === 0) ? '#006400' : '#8B0000'; ctx.fillRect(p.x - p.r + (i * (p.r * 2) / 5), p.y - p.r, (p.r * 2) / 5, p.r * 2); } } 
    else if (tName === 'BOT') { ctx.fillStyle = '#111111'; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); drawStar(p.x, p.y - p.r * 0.45, 5, p.r * 0.2, p.r * 0.08, '#FFFFFF'); }
    
    let grad = ctx.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.1, p.x, p.y, p.r);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.7)'); grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)'); grad.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
    ctx.fillStyle = grad; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); ctx.restore();
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5; ctx.stroke();

    if (p.num) {
        let txtCol = '#FFFFFF'; if (p.isGK) txtCol = '#000'; else if (tName === 'VAS') txtCol = '#FF0000';
        ctx.fillStyle = txtCol; ctx.strokeStyle = '#000000'; ctx.lineWidth = p.isGK ? 1.5 : 3;
        ctx.font = `bold ${p.r * 0.7}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        let numY = (tName === 'BOT' && !p.isGK) ? p.r * 0.2 : 0;
        if(!p.isGK) ctx.strokeText(p.num, p.x, p.y + numY); ctx.fillText(p.num, p.x, p.y + numY);
    }
}

function drawSoccerBall(b) {
    ctx.save(); ctx.translate(b.x, b.y); b.rotation += (Math.abs(b.vx) + Math.abs(b.vy)) * 0.05; ctx.rotate(b.rotation);
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 3;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.fillStyle = '#f4f4f4'; ctx.fill(); ctx.shadowColor = 'transparent'; 
    ctx.fillStyle = '#111'; ctx.beginPath();
    for (let i = 0; i < 5; i++) { let a = i * Math.PI*2/5 - Math.PI/2; let dx = Math.cos(a) * b.r * 0.35; let dy = Math.sin(a) * b.r * 0.35; if (i===0) ctx.moveTo(dx,dy); else ctx.lineTo(dx,dy); }
    ctx.closePath(); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#111';
    for(let i = 0; i < 5; i++){
        let a = i * Math.PI*2/5 - Math.PI/2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*b.r*0.35, Math.sin(a)*b.r*0.35); ctx.lineTo(Math.cos(a)*b.r, Math.sin(a)*b.r); ctx.stroke();
        let aMid = a + Math.PI/5; ctx.beginPath(); ctx.moveTo(Math.cos(aMid)*b.r*0.65, Math.sin(aMid)*b.r*0.65); ctx.lineTo(Math.cos(aMid - 0.22)*b.r, Math.sin(aMid - 0.22)*b.r); ctx.arc(0, 0, b.r, aMid - 0.22, aMid + 0.22); ctx.lineTo(Math.cos(aMid)*b.r*0.65, Math.sin(aMid)*b.r*0.65); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.stroke();
    let grad = ctx.createRadialGradient(-b.r*0.3, -b.r*0.3, b.r*0.1, 0, 0, b.r);
    grad.addColorStop(0, 'rgba(255,255,255,0.7)'); grad.addColorStop(1, 'rgba(0,0,0,0.3)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill(); ctx.restore();
}

function drawFireworks() {
    if (fireworksTimer > 0) {
        fireworksTimer--;
        if (fireworksTimer % 20 === 0) {
            playFireworkSound();
            let tName = STATE === 'CHAMPION' || STATE === 'GAMEOVER' ? playerTeamType : (scoringTeam === 1 ? playerTeamType : aiTeamType);
            let colors = getTeamColors(tName);
            let fx = canvas.width * 0.2 + Math.random() * canvas.width * 0.6; let fy = canvas.height * 0.2 + Math.random() * canvas.height * 0.6;
            for(let i=0; i<40; i++) particles.push({ x: fx, y: fy, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, life: 1.0, decay: 0.015 + Math.random()*0.02, color: Math.random() > 0.5 ? colors[0] : colors[1], size: Math.random()*5 + 2 });
        }
    }
    for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
        else { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); if (p.color === '#000000') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.5; ctx.stroke(); } ctx.globalAlpha = 1.0; }
    }
}

function drawNetGrid(x, y, w, h) {
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
    for(let i=4; i<w; i+=4) { ctx.beginPath(); ctx.moveTo(x+i, y); ctx.lineTo(x+i, y+h); ctx.stroke(); }
    for(let i=4; i<h; i+=4) { ctx.beginPath(); ctx.moveTo(x, y+i); ctx.lineTo(x+w, y+i); ctx.stroke(); }
}

function drawTurnIndicator() {
    if (STATE !== 'IDLE' && STATE !== 'AIMING') return;
    ctx.save();
    ctx.translate(boundLeft / 2, canvas.height / 2); 
    ctx.fillStyle = TURN === 1 ? '#00d2ff' : '#ff3333';
    ctx.beginPath();
    
    // Setas indicam o lado que o jogador ATACA
    if (TURN === 1) { 
        if (p1Side === 'BOTTOM') { ctx.moveTo(0, -30); ctx.lineTo(20, 10); ctx.lineTo(10, 10); ctx.lineTo(10, 40); ctx.lineTo(-10, 40); ctx.lineTo(-10, 10); ctx.lineTo(-20, 10); } // Seta pra Cima
        else { ctx.moveTo(0, 30); ctx.lineTo(20, -10); ctx.lineTo(10, -10); ctx.lineTo(10, -40); ctx.lineTo(-10, -40); ctx.lineTo(-10, -10); ctx.lineTo(-20, -10); } // Seta pra Baixo
    } else { 
        if (p1Side === 'BOTTOM') { ctx.moveTo(0, 30); ctx.lineTo(20, -10); ctx.lineTo(10, -10); ctx.lineTo(10, -40); ctx.lineTo(-10, -40); ctx.lineTo(-10, -10); ctx.lineTo(-20, -10); } // Seta pra Baixo
        else { ctx.moveTo(0, -30); ctx.lineTo(20, 10); ctx.lineTo(10, 10); ctx.lineTo(10, 40); ctx.lineTo(-10, 40); ctx.lineTo(-10, 10); ctx.lineTo(-20, 10); } // Seta pra Cima
    }
    
    ctx.closePath(); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 5;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
}

function drawField() {
    if (fieldType === 0) { const sh = canvas.height / 12; for (let i = 0; i < 13; i++) { ctx.fillStyle = i % 2 === 0 ? '#388E3C' : '#4CAF50'; ctx.fillRect(0, i * sh, canvas.width, sh); } } 
    else if (fieldType === 1) { ctx.fillStyle = '#1b5e20'; ctx.fillRect(0, 0, canvas.width, canvas.height); } 
    else if (fieldType === 2) { ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0, 0, canvas.width, canvas.height); }

    let overlayGrad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, fieldW*0.1, canvas.width/2, canvas.height/2, fieldH*0.7);
    overlayGrad.addColorStop(0, 'rgba(0, 0, 0, 0)'); overlayGrad.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
    ctx.fillStyle = overlayGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3;
    ctx.strokeRect(boundLeft, boundTop, fieldW, fieldH);
    ctx.beginPath(); ctx.moveTo(boundLeft, canvas.height / 2); ctx.lineTo(boundRight, canvas.height / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, fieldW*0.15, 0, Math.PI * 2); ctx.stroke();
    
    ctx.strokeRect(canvas.width/2 - areaW/2, boundTop, areaW, areaH);
    ctx.strokeRect(canvas.width/2 - areaW/2, boundBottom - areaH, areaW, areaH);
    let ml = areaW * 0.35; ctx.beginPath(); ctx.arc(canvas.width/2, boundTop + areaH, ml, 0, Math.PI); ctx.stroke(); ctx.beginPath(); ctx.arc(canvas.width/2, boundBottom - areaH, ml, Math.PI, Math.PI*2); ctx.stroke();
    const cr = fieldW * 0.05; ctx.beginPath(); ctx.arc(boundLeft, boundTop, cr, 0, Math.PI/2); ctx.stroke(); ctx.beginPath(); ctx.arc(boundRight, boundTop, cr, Math.PI/2, Math.PI); ctx.stroke(); ctx.beginPath(); ctx.arc(boundRight, boundBottom, cr, Math.PI, Math.PI*1.5); ctx.stroke(); ctx.beginPath(); ctx.arc(boundLeft, boundBottom, cr, Math.PI*1.5, Math.PI*2); ctx.stroke();
    
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 5;
    ctx.fillStyle = '#FFFFFF'; 
    ctx.fillRect(canvas.width/2 - goalWidth/2, boundTop - 3, goalWidth, 6); 
    ctx.fillRect(canvas.width/2 - goalWidth/2, boundBottom - 3, goalWidth, 6);
    ctx.restore();

    drawNetGrid(canvas.width/2 - goalWidth/2, boundTop - goalDepth, goalWidth, goalDepth); 
    drawNetGrid(canvas.width/2 - goalWidth/2, boundBottom, goalWidth, goalDepth); 
}

function draw() {
    if (STATE === 'MENU' || document.getElementById('ui-game').classList.contains('hidden')) { drawFireworks(); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height); 
    
    updateCelebrations();
    drawField();

    for (let gk of goalkeepers) drawButton(gk);
    for (let p of players) drawButton(p);
    if (STATE !== 'FORMATION' && ball.visible) drawSoccerBall(ball);

    drawTurnIndicator();

    if (STATE === 'AIMING' && selectedPlayer) {
        let dx = dragStart.x - dragCurrent.x; let dy = dragStart.y - dragCurrent.y;
        ctx.beginPath(); ctx.moveTo(selectedPlayer.x, selectedPlayer.y); ctx.lineTo(selectedPlayer.x + dx, selectedPlayer.y + dy);
        let force = Math.min(Math.hypot(dx, dy), 60); ctx.strokeStyle = force > 40 ? '#ff3333' : force > 20 ? '#ffff33' : '#ffffff';
        ctx.lineWidth = 4; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
    } else if (STATE === 'DRAGGING' && selectedPlayer) {
        ctx.beginPath(); ctx.arc(selectedPlayer.x, selectedPlayer.y, selectedPlayer.r + 5, 0, Math.PI*2);
        ctx.strokeStyle = '#00d2ff'; ctx.lineWidth = 3; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
    }
    
    drawFireworks();
    drawPopup();
}

function gameLoop() { updatePhysics(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
